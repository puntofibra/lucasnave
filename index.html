<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LUCAS Y LA NAVE PERDIDA</title>
<meta name="description" content="Una aventura gráfica espacial para niños con Lucas, el pequeño robot. ¡Arregla la nave y vuelve a casa!">
<meta property="og:title" content="LUCAS Y LA NAVE PERDIDA">
<meta property="og:description" content="Una aventura gráfica espacial para niños. ¡Ayuda a Lucas a arreglar la nave!">
<meta property="og:image" content="https://puntofibra.github.io/lucasnave/img/og.jpg">
<meta property="og:url" content="https://puntofibra.github.io/lucasnave/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#070a1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon/icon-192.png">
<link rel="apple-touch-icon" href="img/icon/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--neon:#29e6ff;--ok:#35ff8a;--gold:#ffd23c;--bg:#070a1e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Baloo 2',system-ui,sans-serif;color:#fff}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#cv{display:block;background:#05060f;touch-action:none}
#ui{position:fixed;pointer-events:none}
.btn{pointer-events:auto;font:800 20px 'Baloo 2',system-ui;color:#fff;background:linear-gradient(180deg,#1b3a7a,#0c1a44);border:3px solid var(--neon);border-radius:18px;padding:10px 22px;cursor:pointer;box-shadow:0 0 14px rgba(41,230,255,.45),inset 0 2px 0 rgba(255,255,255,.2);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn:active{transform:scale(.96)}
.btn.gold{border-color:var(--gold);background:linear-gradient(180deg,#7a5a10,#3a2a04);box-shadow:0 0 16px rgba(255,210,60,.5)}
.btn.green{border-color:var(--ok);background:linear-gradient(180deg,#14603a,#06301a);box-shadow:0 0 16px rgba(53,255,138,.5)}
.btn.sm{font-size:15px;padding:6px 14px;border-radius:14px}
.ico{pointer-events:auto;width:58px;height:58px;border-radius:16px;border:3px solid var(--neon);background:rgba(8,14,40,.85);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 12px rgba(41,230,255,.45);font-size:28px}
.ico:active{transform:scale(.94)}
#hud{position:absolute;left:14px;top:12px;display:flex;gap:10px;align-items:center}
#chips{pointer-events:none;display:flex;align-items:center;gap:6px;font:900 22px Orbitron,system-ui;color:var(--gold);text-shadow:0 0 8px rgba(255,210,60,.7);background:rgba(8,14,40,.75);border:2px solid rgba(255,210,60,.6);border-radius:14px;padding:4px 12px 4px 6px}
#chips img{width:30px;height:30px}
#inv{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:10px;padding:8px 12px;background:linear-gradient(180deg,rgba(10,20,50,.92),rgba(4,8,24,.92));border:3px solid rgba(41,230,255,.55);border-radius:22px;box-shadow:0 0 20px rgba(41,230,255,.3);pointer-events:auto;min-width:120px;min-height:86px;align-items:center;justify-content:center}
#inv .slot{width:70px;height:70px;border-radius:14px;background:rgba(41,230,255,.08);border:2px solid rgba(41,230,255,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:40px}
#inv .slot.sel{border-color:var(--gold);box-shadow:0 0 14px var(--gold);background:rgba(255,210,60,.18)}
#inv .slot.new{animation:newit 1s ease 3}
#inv .slot img{max-width:58px;max-height:58px}
#inv .empty{color:#6a7ab0;font-size:16px;font-weight:800}
@keyframes newit{50%{transform:scale(1.25);box-shadow:0 0 22px var(--ok)}}
#narr{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(86%,900px);background:linear-gradient(180deg,rgba(14,20,56,.96),rgba(6,10,30,.96));border:3px solid var(--gold);border-radius:22px;padding:14px 22px 14px 76px;font-size:30px;line-height:1.25;font-weight:800;color:#fff8e0;box-shadow:0 0 24px rgba(255,210,60,.35);display:none;pointer-events:auto}
#narr.on{display:block;animation:pop .25s ease}
#narr .who{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe680,#c08a10);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 12px rgba(255,210,60,.7)}
#bub{position:absolute;display:none;max-width:420px;min-width:120px;background:#fff;color:#141a33;border:4px solid #141a33;border-radius:26px;padding:12px 18px;font-size:30px;line-height:1.2;font-weight:800;box-shadow:6px 6px 0 rgba(0,0,0,.35);pointer-events:auto;transform-origin:50% 100%}
#bub.on{display:block;animation:pop .22s cubic-bezier(.3,1.6,.6,1)}
#bub:after{content:'';position:absolute;left:var(--tx,50%);bottom:-26px;transform:translateX(-50%);border:14px solid transparent;border-top:18px solid #141a33}
#bub:before{content:'';position:absolute;left:var(--tx,50%);bottom:-17px;transform:translateX(-50%);border:10px solid transparent;border-top:14px solid #fff;z-index:1}
#bub .nm{display:block;font-size:16px;color:#2a5ad0;letter-spacing:.06em;margin-bottom:2px}
#bub .snd,#narr .snd{position:absolute;right:-14px;top:-14px;width:40px;height:40px;border-radius:50%;background:#2a5ad0;color:#fff;border:3px solid #141a33;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
#narr .snd{border-color:var(--gold)}
.tap{position:absolute;right:16px;bottom:6px;font-size:15px;color:#9fb4ff;animation:blink 1s infinite}
#bub .tap{color:#7a86b0;bottom:-2px;right:12px}
@keyframes blink{50%{opacity:.25}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#narr.on{animation:none}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;pointer-events:auto;text-align:center;padding:20px}
.ov.on{display:flex}
#title{background:radial-gradient(ellipse at 50% 30%,#1a2a6a,#05060f 72%)}
#title .logo{font:900 clamp(30px,6vw,70px)/1 Orbitron,system-ui;letter-spacing:.04em;text-shadow:0 0 18px var(--neon),0 4px 0 #0a1a4a}
#title .logo small{display:block;font-size:.42em;color:var(--neon);letter-spacing:.3em;margin-bottom:8px}
#title .logo b{color:var(--gold);text-shadow:0 0 18px rgba(255,210,60,.8),0 4px 0 #4a3000}
#title .hero{height:clamp(140px,30vh,300px);filter:drop-shadow(0 0 20px rgba(41,230,255,.5));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
#title .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#acc{position:absolute;top:12px;right:14px;font-size:15px;color:#9fb4ff;display:flex;gap:8px;align-items:center}
.card{background:linear-gradient(180deg,#101a46,#060a24);border:3px solid var(--neon);border-radius:24px;padding:22px 26px;max-width:520px;width:100%;box-shadow:0 0 30px rgba(41,230,255,.35);display:flex;flex-direction:column;gap:12px;align-items:center;max-height:94%;overflow:auto}
.card h2{margin:0;font:900 26px Orbitron,system-ui;color:var(--neon)}
.card input{font:700 20px 'Baloo 2',system-ui;width:100%;padding:10px 14px;border-radius:14px;border:2px solid var(--neon);background:#020a1e;color:#fff}
.card .msg{color:var(--gold);min-height:22px;font-size:17px}
.card a{color:var(--neon);cursor:pointer;font-size:16px}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
#fade.on{opacity:1}
#rot{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(ellipse at 50% 40%,#1a2a6a,#05060f 75%);font-size:26px;text-align:center;padding:24px}
#rot img{height:180px;animation:spinp 2.4s ease-in-out infinite}
@keyframes spinp{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:900px){#rot.need{display:flex}}
#con{position:fixed;inset:0;z-index:40;background:rgba(0,4,10,.96);display:none;flex-direction:column;padding:18px;font:700 18px 'Courier New',monospace;color:#29e6ff}
#con.on{display:flex}
#conOut{flex:1;overflow:auto;white-space:pre-wrap}
#conOut .g{color:#35ff8a}#conOut .r{color:#ff5a6a}#conOut .y{color:#ffd23c}#conOut .big{font-size:24px}
#conRow{display:flex;gap:8px;align-items:center}
#conIn{flex:1;background:transparent;border:none;border-bottom:2px solid #29e6ff;color:#fff;font:700 20px 'Courier New',monospace;outline:none;padding:6px}
#adm{position:fixed;inset:0;z-index:45;background:#050818;display:none;flex-direction:column;font-family:system-ui,sans-serif}
#adm.on{display:flex}
#adm .ahead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid #29e6ff}
#adm h1{margin:0;font:900 18px Orbitron,system-ui;color:#29e6ff}
#adm .atabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px}
#adm .atabs .btn.on{border-color:#ffd23c}
#adm .abody{flex:1;overflow:auto;padding:12px 18px;color:#cfe0ff}
#adm .arow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#adm .akey{background:rgba(41,230,255,.08);border:1px solid rgba(41,230,255,.3);border-radius:12px;padding:10px 12px;margin:8px 0}
#adm .amsg{color:#ffd23c;padding:6px 16px;min-height:24px}
.nfcw{position:relative;width:96px;height:96px;margin:10px 0;color:#29e6ff;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 8px #29e6ff)}
.nfcw i{position:absolute;inset:0;border-radius:50%;border:2px solid #29e6ff;animation:nfcp 2s infinite}.nfcw i+i{animation-delay:1s}
@keyframes nfcp{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
#conQr{position:fixed;right:20px;bottom:20px;background:#fff;padding:10px;border-radius:12px;color:#000;text-align:center;font:700 14px system-ui}
#conQr img{width:220px;height:220px;display:block}
#coins{pointer-events:none;display:flex;align-items:center;gap:6px;font:900 22px Orbitron,system-ui;color:#ffe680;text-shadow:0 0 8px rgba(255,210,60,.7);background:rgba(8,14,40,.75);border:2px solid rgba(255,230,120,.6);border-radius:14px;padding:4px 12px 4px 8px}
#coins i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc21a 55%,#a86a00);border:2px solid #6a4000;display:inline-block}
#ctl{position:absolute;inset:0;pointer-events:none;display:none}
#ctl .cb{position:absolute;bottom:14px;width:104px;height:104px;border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;font:900 44px 'Baloo 2',system-ui;color:#fff;background:radial-gradient(circle at 40% 30%,rgba(60,110,220,.75),rgba(8,16,50,.8));border:4px solid rgba(41,230,255,.75);box-shadow:0 0 16px rgba(41,230,255,.45);touch-action:none}
#ctl .cb.on{transform:scale(.92);background:radial-gradient(circle at 40% 30%,rgba(90,200,255,.9),rgba(20,60,140,.9))}
#bL{left:18px}#bR{left:140px}#bJ{right:18px}
#bAct{right:140px;border-color:var(--gold)!important;background:radial-gradient(circle at 40% 30%,rgba(255,210,60,.85),rgba(120,70,0,.85))!important;opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s;pointer-events:none!important}
#bAct.show{opacity:1;transform:scale(1);pointer-events:auto!important;animation:actp 1.2s ease-in-out infinite}
@keyframes actp{50%{box-shadow:0 0 30px var(--gold)}}
#inv{min-height:72px!important;padding:6px 10px!important}
#inv .slot{width:58px!important;height:58px!important;font-size:34px!important}
#inv .slot img{max-width:48px!important;max-height:48px!important}
.choice{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.choice button{pointer-events:auto;width:200px;min-height:170px;border-radius:22px;border:4px solid var(--neon);background:linear-gradient(180deg,#1b3a7a,#0c1a44);color:#fff;font:800 22px 'Baloo 2',system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 0 16px rgba(41,230,255,.4)}
.choice button b{font-size:64px;line-height:1}
.choice button:active{transform:scale(.95)}
.choice button[disabled]{opacity:.4}
.choice .pr{font:900 20px Orbitron;color:#ffe680}
.card.wide{max-width:900px}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="ui">
  <div id="hud" style="display:none">
    <div class="ico" id="bMenu" title="Menú">☰</div>
    <div class="ico" id="bHint" title="Pista">💡</div>
    <div id="coins"><i></i><span id="coinN">0</span></div>
    <div id="chips"><img src="img/obj-chip.webp" alt=""><span id="chipN">0</span></div>
  </div>
  <div id="inv" style="display:none"></div>
  <div id="ctl"><div class="cb" id="bL">◀</div><div class="cb" id="bR">▶</div><div class="cb" id="bAct">✋</div><div class="cb" id="bJ">⤒</div></div>
  <div id="narr"><div class="who">📢</div><span id="narrT"></span><div class="snd" id="narrS">🔊</div><div class="tap">toca ▸</div></div>
  <div id="bub"><span class="nm" id="bubN"></span><span id="bubT"></span><div class="snd" id="bubS">🔊</div><div class="tap">toca ▸</div></div>
  <div class="ov" id="title">
    <div id="acc"></div>
    <img class="hero" src="img/lucas-celebrando.webp" alt="">
    <div class="logo" id="logo"><small>LUCAS Y LA</small>NAVE <b>PERDIDA</b></div>
    <div class="row" id="tBtns"></div>
    <div class="row"><button class="btn sm" id="bInstall" style="display:none">📲 INSTALAR</button><button class="btn sm" id="bShare">📤 COMPARTIR</button><button class="btn sm" id="bWeb">🌐 WEB DEL CREADOR</button></div>
  </div>
  <div class="ov" id="modal"></div>
  <div id="fade"></div>
</div>
<div id="rot"><img src="img/lucas-quieto.webp" alt=""><div>¡Gira el móvil!<br><span style="font-size:20px;color:#9fb4ff">Lucas necesita la pantalla en horizontal 🔄</span></div></div>
<div id="con"><div id="conOut"></div><div id="conRow"><span>&gt;</span><input id="conIn" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn sm" id="conX">SALIR</button></div></div>
<div id="adm"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="game.js?v=5"></script>
</body>
</html>
